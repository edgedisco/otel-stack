receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  transform:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # If EdgeDisco emits an asset event with empty body, construct a readable body for log viewers
          - 'set(body, Concat(["edgedisco.asset.observed: ", attributes["asset.name"], " (", attributes["asset.vendor"], ") [kind=", attributes["asset.kind"], "]"], "")) where (body == nil or body == "") and attributes["asset.name"] != nil'
  batch:
    send_batch_size: 256
    timeout: 1s

exporters:
  # Loki native OTLP HTTP receiver (Loki 3.0+)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Tempo OTLP gRPC receiver
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Prometheus scrape endpoint
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: otel

  # Console debug output for live verification of incoming telemetry
  debug:
    verbosity: detailed

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform, batch]
      exporters: [otlphttp/loki, debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
